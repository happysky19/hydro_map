# Extraction settings; full-period meteorological quality remains under review.
period:
  start: '1996-01-01'
  end: '2025-12-31'
  daily_time_zone: UTC
  reason: Requested 30-year window; retain the final AORC precipitation day with a missing-boundary flag.
  aorc_missing_boundary_hour: '2026-01-01T00:00:00Z'
pilot_projects:
  - MICA
  - ARROW
  - ALBENI_FALLS
  - BROWNLEE
  - LOWER_GRANITE
  - THE_DALLES
sources:
  aorc:
    role: primary_forcing_candidate
    version: '1.1'
    url: https://noaa-nws-aorc-v1-1-1km.s3.amazonaws.com/
    variables: [APCP_surface, TMP_2maboveground, SPFH_2maboveground, PRES_surface, DSWRF_surface, DLWRF_surface, UGRD_10maboveground, VGRD_10maboveground]
    status: full_time_axis_verified_all_project_samples_verified_full_data_scan_pending
  daymet:
    role: independent_method_comparison
    version: V4R1
    collection_concept_id: C2532426483-ORNL_CLOUD
    variables: [prcp, tmin, tmax, vp, srad, dayl, swe]
    status: authenticated_polygon_pilots_verified_full_period_coverage_pending
  era5_land:
    role: optional_land_state_and_forcing_comparison
    dataset: reanalysis-era5-land
    status: ncar_three_field_polygon_sample_verified_complete_cds_archive_access_pending
    tested_mirror: https://gdex.ucar.edu/datasets/d633008/
    tested_mirror_start: '2001-11-01T01:00:00Z'
  era5:
    role: optional_atmospheric_fields
    datasets: [reanalysis-era5-single-levels, reanalysis-era5-pressure-levels]
    status: documentation_verified_authenticated_access_pending
