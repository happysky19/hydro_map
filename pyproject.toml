[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydro-map"
version = "0.1.0"
description = "Select and compare project catchments from HydroBASINS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7,<4",
  "pyproj>=3.6,<4",
  "pyshp>=2.3,<4",
  "PyYAML>=6,<7",
  "shapely>=2.1,<3",
]

[project.scripts]
hydro-map = "hydro_map.cli:main"

[project.optional-dependencies]
maps = ["contextily>=1.7.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]
