[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catchment-history"
version = "0.1.0"
description = "Daily catchment-mean meteorology from AORC, ERA5-Land and ERA5."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cdsapi>=0.7.7,<1",
  "matplotlib>=3.7,<4",
  "netCDF4>=1.6,<2",
  "numcodecs>=0.12,<1",
  "numpy>=1.24,<3",
  "pyproj>=3.6,<4",
  "requests>=2.31,<3",
  "shapely>=2.1,<3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
test = ["pytest>=7", "pyarrow>=14"]

[project.scripts]
catchment-history = "catchment_history.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
